<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Send Documents · {{ customer_name }}</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto; }
  .glass { background: rgba(255,255,255,.85); backdrop-filter: blur(14px); }
  .bg-aurora {
    background:
      radial-gradient(1200px 600px at 10% -10%, #c7d2fe 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #fbcfe8 0%, transparent 60%),
      radial-gradient(800px 500px at 50% 120%, #a7f3d0 0%, transparent 60%),
      #f8fafc;
  }
  .card-3d { box-shadow: 0 30px 60px -20px rgba(79,70,229,.35), 0 18px 36px -18px rgba(0,0,0,.25); }
  .btn-3d {
    background: linear-gradient(180deg,#6366f1,#4f46e5);
    box-shadow: 0 10px 0 -4px #3730a3, 0 20px 30px -10px rgba(79,70,229,.6);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn-3d:active { transform: translateY(4px); box-shadow: 0 6px 0 -4px #3730a3, 0 8px 16px -6px rgba(79,70,229,.6); }
</style>
</head>
<body class="bg-aurora min-h-screen">
<div class="max-w-md mx-auto p-4 pt-10">
  <div class="glass card-3d rounded-3xl p-6 border border-white/60">
    <div class="text-center">
      <div class="inline-flex h-14 w-14 items-center justify-center rounded-2xl bg-indigo-600 text-white text-2xl shadow-lg">📄</div>
      <h1 class="mt-3 text-2xl font-extrabold text-slate-900">Send your documents</h1>
      <p class="text-sm text-slate-600 mt-1">to <b>{{ customer_name }}</b>'s operator</p>
    </div>

    <label for="picker" class="mt-6 block cursor-pointer">
      <div id="drop" class="rounded-2xl border-2 border-dashed border-indigo-300 bg-white/70 p-6 text-center hover:bg-white">
        <div class="text-4xl">📷</div>
        <div class="mt-2 font-semibold text-slate-800">Tap to take a photo<br/>or pick a file</div>
        <div class="text-xs text-slate-500 mt-1">JPG, PNG, PDF · up to 12 MB each</div>
      </div>
      <input id="picker" type="file" multiple accept="image/*,application/pdf" capture="environment" class="hidden"/>
    </label>

    <ul id="list" class="mt-4 space-y-2 text-sm"></ul>

    <button id="sendBtn" class="btn-3d mt-5 w-full rounded-xl py-3 text-white font-semibold disabled:opacity-50" disabled>
      Send to operator
    </button>

    <p id="status" class="text-center text-sm mt-3 text-slate-600"></p>
  </div>

  <p class="text-center text-xs text-slate-500 mt-6">🔒 Documents are sent directly to the operator's device. Nothing is stored on our servers.</p>
</div>

<script>
const picker = document.getElementById('picker');
const list = document.getElementById('list');
const sendBtn = document.getElementById('sendBtn');
const statusEl = document.getElementById('status');
let queued = [];

picker.addEventListener('change', () => {
  for (const f of picker.files) queued.push(f);
  render();
});
function render() {
  list.innerHTML = '';
  queued.forEach((f, i) => {
    const li = document.createElement('li');
    li.className = 'flex items-center justify-between bg-white/80 border rounded-xl px-3 py-2';
    li.innerHTML = `<span class="truncate">📎 ${f.name} <span class="text-xs text-slate-400">(${(f.size/1024).toFixed(0)} KB)</span></span>
                    <button class="text-red-500 text-xs ml-2" data-i="${i}">Remove</button>`;
    list.appendChild(li);
  });
  list.querySelectorAll('button').forEach(b => b.onclick = () => {
    queued.splice(+b.dataset.i, 1); render();
  });
  sendBtn.disabled = queued.length === 0;
}

sendBtn.addEventListener('click', async () => {
  sendBtn.disabled = true;
  statusEl.textContent = 'Sending…';
  const fd = new FormData();
  queued.forEach(f => fd.append('files', f));
  try {
    const r = await fetch('{{ url_for("handoff.customer_upload", token=token) }}', { method: 'POST', body: fd });
    const j = await r.json();
    if (j.ok) {
      statusEl.innerHTML = '<span class="text-green-600 font-semibold">✅ Sent ' + j.received + ' file(s)!</span><br/>You may add and send more.';
      queued = []; render();
    } else {
      statusEl.innerHTML = '<span class="text-red-600">' + (j.error || 'Failed') + '</span>';
      sendBtn.disabled = false;
    }
  } catch (e) {
    statusEl.innerHTML = '<span class="text-red-600">Network error. Try again.</span>';
    sendBtn.disabled = false;
  }
});
</script>
</body>
</html>
