{% extends "base.html" %}
{% block title %}Record Payment{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto">
  <h1 class="text-3xl font-extrabold h-display mb-1">💳 Record Payment</h1>
  <p class="text-slate-600 text-sm mb-5">Log a payment collected from a customer.</p>

  <form method="post" class="card-3d p-5 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

    <div>
      <label class="block text-sm font-semibold mb-1">Amount (₹)</label>
      <input type="number" step="0.01" min="0.01" name="amount" required class="w-full" placeholder="0.00"/>
    </div>

    <div>
      <label class="block text-sm font-semibold mb-1">Payment Method</label>
      <select name="method" class="w-full">
        {% for m in methods %}<option value="{{ m }}">{{ m }}</option>{% endfor %}
      </select>
    </div>

    <div>
      <label class="block text-sm font-semibold mb-1">Linked Service (optional)</label>
      <select name="service_id" class="w-full">
        <option value="">— None —</option>
        {% for s in services %}
          <option value="{{ s.id }}">{{ s.service_type }} — {{ s.customer.full_name }} (₹{{ '%.2f'|format(s.amount or 0) }})</option>
        {% endfor %}
      </select>
    </div>

    <div class="flex gap-2 justify-end pt-2">
      <a href="{{ url_for('payment.list_payments') }}" class="px-4 py-2 rounded-lg bg-slate-100 text-slate-700 font-semibold">Cancel</a>
      <button class="btn-3d">Save Payment</button>
    </div>
  </form>
</div>
{% endblock %}
