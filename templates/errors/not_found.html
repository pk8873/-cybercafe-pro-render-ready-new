{% extends "base.html" %}
{% block title %}Page not found{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto mt-10">
  <div class="card-3d p-8 text-center">
    <div class="text-6xl float-slow">🧭</div>
    <h1 class="mt-3 text-2xl font-extrabold h-display">Page not found</h1>
    <p class="mt-2 text-slate-600">The page you tried to open doesn't exist. The app is still running normally.</p>
    <div class="mt-6 flex flex-wrap items-center justify-center gap-2">
      <a href="javascript:history.back()" class="btn-ghost">← Go back</a>
      <a href="{{ url_for('public.home') }}" class="btn-3d">Home</a>
    </div>
  </div>
</div>
{% endblock %}
