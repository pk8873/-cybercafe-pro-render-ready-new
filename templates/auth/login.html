{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <div class="card-3d p-8">
    <div class="text-center">
      <div class="inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-500 to-fuchsia-500 text-white text-xl shadow-lg">🔐</div>
      <h1 class="text-2xl font-extrabold mt-3 h-display">Welcome back</h1>
      <p class="text-sm text-slate-500">Login to your CyberCafe ERP account</p>
    </div>
    <form method="post" class="mt-6 space-y-3">
      {{ form.hidden_tag() }}
      <div class="field"><label>Email</label>{{ form.email(placeholder="you@example.com") }}</div>
      <div class="field"><label>Password</label>{{ form.password(placeholder="••••••••") }}</div>
      <label class="flex items-center gap-2 text-sm text-slate-600">{{ form.remember() }} Remember me</label>
      <button class="btn-3d w-full justify-center py-3 mt-2">Login →</button>
    </form>
    <p class="text-sm mt-5 text-center text-slate-600">No account? <a href="{{ url_for('auth.register') }}" class="text-indigo-600 font-semibold">Register free</a></p>
  </div>
</div>
{% endblock %}
