{% extends "base.html" %}
{% block title %}Edit · {{ doc.original_name }}{% endblock %}
{% block content %}
<a href="{{ url_for('customer.view', cid=c.id) }}" class="text-sm text-slate-500 hover:text-indigo-600">← Back to {{ c.full_name }}</a>

<div class="card-3d p-6 mt-3">
  <div class="flex items-center justify-between flex-wrap gap-3 mb-4">
    <div>
      <h1 class="text-2xl font-extrabold h-display">🖼️ Image Editor</h1>
      <p class="text-sm text-slate-600">Edit · Make Replica · Export PDF — all in one click.</p>
    </div>
    <div class="flex flex-wrap gap-2">
      <button id="btn-replica" class="btn-3d" style="background:linear-gradient(135deg,#06b6d4,#0e7490)">📑 Save Replica (Copy)</button>
      <button id="btn-pdf" class="btn-3d" style="background:linear-gradient(135deg,#ef4444,#b91c1c)">📄 Save as PDF</button>
      <button id="btn-edited" class="btn-3d">💾 Save Edited Copy</button>
    </div>
  </div>

  <div class="grid lg:grid-cols-4 gap-4">
    <div class="lg:col-span-3">
      <div style="background:#0f172a;border-radius:1rem;padding:12px;min-height:420px;display:flex;align-items:center;justify-content:center;overflow:auto">
        <canvas id="canvas" style="max-width:100%;background:#fff;border-radius:.5rem;box-shadow:0 10px 30px rgba(0,0,0,.4)"></canvas>
      </div>
    </div>
    <div class="space-y-3">
      <div class="glass-card p-4">
        <h3 class="font-bold text-sm mb-2">Rotate</h3>
        <div class="flex gap-2">
          <button data-rot="-90" class="ed-btn">↺ -90°</button>
          <button data-rot="90" class="ed-btn">↻ +90°</button>
          <button data-rot="180" class="ed-btn">⟳ 180°</button>
        </div>
      </div>
      <div class="glass-card p-4">
        <h3 class="font-bold text-sm mb-2">Flip</h3>
        <div class="flex gap-2">
          <button id="flip-h" class="ed-btn">↔ Horizontal</button>
          <button id="flip-v" class="ed-btn">↕ Vertical</button>
        </div>
      </div>
      <div class="glass-card p-4">
        <h3 class="font-bold text-sm mb-2">Brightness</h3>
        <input type="range" id="bright" min="50" max="200" value="100" class="w-full"/>
        <h3 class="font-bold text-sm mb-2 mt-3">Contrast</h3>
        <input type="range" id="contrast" min="50" max="200" value="100" class="w-full"/>
        <h3 class="font-bold text-sm mb-2 mt-3">Grayscale</h3>
        <input type="range" id="gray" min="0" max="100" value="0" class="w-full"/>
      </div>
      <div class="glass-card p-4">
        <button id="btn-reset" class="ed-btn w-full">↺ Reset All</button>
      </div>
    </div>
  </div>
</div>

<style>
  .ed-btn{padding:8px 12px;border-radius:.6rem;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-weight:600;font-size:13px;box-shadow:0 4px 12px rgba(79,70,229,.3);transition:transform .15s}
  .ed-btn:hover{transform:translateY(-1px)}
</style>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
(function(){
  const imgUrl = "{{ url_for('customer.download_document', cid=c.id, doc_id=doc.id) }}";
  const origName = "{{ doc.original_name|e }}";
  const baseName = origName.replace(/\.[^.]+$/, '') || 'image';

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.crossOrigin = 'anonymous';

  let state = { rot: 0, flipH: 1, flipV: 1, bright: 100, contrast: 100, gray: 0 };

  function render(){
    if (!img.complete || !img.naturalWidth) return;
    const rad = state.rot * Math.PI / 180;
    const sin = Math.abs(Math.sin(rad)), cos = Math.abs(Math.cos(rad));
    const w = img.naturalWidth, h = img.naturalHeight;
    canvas.width = w * cos + h * sin;
    canvas.height = w * sin + h * cos;
    ctx.save();
    ctx.filter = `brightness(${state.bright}%) contrast(${state.contrast}%) grayscale(${state.gray}%)`;
    ctx.translate(canvas.width/2, canvas.height/2);
    ctx.rotate(rad);
    ctx.scale(state.flipH, state.flipV);
    ctx.drawImage(img, -w/2, -h/2);
    ctx.restore();
  }
  img.onload = render;
  img.onerror = () => alert('Could not load image. Try again.');
  img.src = imgUrl;

  document.querySelectorAll('[data-rot]').forEach(b => b.onclick = () => { state.rot = (state.rot + parseInt(b.dataset.rot)) % 360; render(); });
  document.getElementById('flip-h').onclick = () => { state.flipH *= -1; render(); };
  document.getElementById('flip-v').onclick = () => { state.flipV *= -1; render(); };
  document.getElementById('bright').oninput = e => { state.bright = e.target.value; render(); };
  document.getElementById('contrast').oninput = e => { state.contrast = e.target.value; render(); };
  document.getElementById('gray').oninput = e => { state.gray = e.target.value; render(); };
  document.getElementById('btn-reset').onclick = () => {
    state = { rot:0, flipH:1, flipV:1, bright:100, contrast:100, gray:0 };
    document.getElementById('bright').value = 100;
    document.getElementById('contrast').value = 100;
    document.getElementById('gray').value = 0;
    render();
  };

  function download(blob, name){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  // Replica = exact copy of original (no edits applied)
  document.getElementById('btn-replica').onclick = async () => {
    try {
      const res = await fetch(imgUrl);
      const blob = await res.blob();
      download(blob, baseName + '-replica' + (origName.match(/\.[^.]+$/)?.[0] || '.png'));
      window.LV && LV.toast('Replica saved', 'A perfect copy has been downloaded.', 'success');
    } catch(e){ alert('Failed: ' + e.message); }
  };

  document.getElementById('btn-edited').onclick = () => {
    canvas.toBlob(b => { download(b, baseName + '-edited.png'); window.LV && LV.toast('Saved', 'Edited copy downloaded.', 'success'); }, 'image/png');
  };

  document.getElementById('btn-pdf').onclick = () => {
    const { jsPDF } = window.jspdf;
    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
    const w = canvas.width, h = canvas.height;
    const orientation = w > h ? 'l' : 'p';
    const pdf = new jsPDF({ orientation, unit: 'pt', format: [w, h] });
    pdf.addImage(dataUrl, 'JPEG', 0, 0, w, h);
    pdf.save(baseName + '.pdf');
    window.LV && LV.toast('PDF saved', 'Your PDF has been downloaded.', 'success');
  };
})();
</script>
{% endblock %}
