services:
  - type: web
    name: cybercafe-erp
    env: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # DATABASE_URL is optional. If not set, the app uses a local SQLite
      # file (data resets on each deploy on Render's free tier).
      # To use Postgres, create a Render Postgres database in the SAME
      # region as this web service, then set DATABASE_URL to its
      # "Internal Database URL" (recommended) or "External Database URL".
      - key: ADMIN_EMAIL
        value: admin@cybercafe.local
      - key: ADMIN_PASSWORD
        value: Admin@12345
      - key: PYTHON_VERSION
        value: 3.12.7
